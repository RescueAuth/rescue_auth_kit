# CNB pipeline configuration for rescue_auth_kit
#
# Pipeline layout:
#   $  (fallback branch)
#     issue.comment@npc        -> NPC issue-comment runner (existing, untouched)
#     pull_request.comment@npc -> NPC PR-comment runner (existing, untouched)
#     web_trigger_debug_apk    -> owner-triggered DEBUG APK build (any dev branch)
#     tag_push                 -> PRODUCTION release, ONLY from rescueauth-vX.Y.Z tags
#   main
#     push                  -> full cloud test loop incl. guarded Firebase Test Lab
#
# ---------------------------------------------------------------------------
# Build & Release Workflow (see README "Branch / Version / Release Policy"):
#
#   DEVELOPMENT:
#     feature/fix branch or main
#       -> owner triggers "Build debug RescueAuth" (web_trigger_debug_apk)
#       -> tests / assembleDebug / debug signing
#       -> RescueAuth-<versionName>-debug-<shortCommit>.apk
#       -> real-device smoke -> PR -> main
#
#   RELEASE (TAG-ONLY):
#     main reaches release-ready
#       -> owner creates annotated tag:  rescueauth-vX.Y.Z
#       -> tag_push pipeline (below)
#       -> assert tag format ^rescueauth-v[0-9]+\.[0-9]+\.[0-9]+$
#       -> assert tag version == Android versionName
#       -> production Secret Repo import (signing stage only)
#       -> temporary PKCS12 -> production signing
#       -> apksigner verify + pinned cert fingerprint + APK identity
#       -> RescueAuth-X.Y.Z.apk attached to the tag's commit
#
#   main / feature / fix branches are NEVER production-released.
#   Legacy tags (namespace legacy-vX.Y.Z) are preserved and never enter the
#   new production release path.
#
# ---------------------------------------------------------------------------
# Security boundary:
#   * Firebase credentials are imported ONLY by the `main`+`push` pipeline below.
#   * The production Android signing Secret Repo
#     (xincy22/rescue_auth_kit_secrets -> android-signing.yml) is imported ONLY
#     by the `production-sign-and-verify` stage of the `tag_push` pipeline. No
#     other stage/pipeline imports it. The debug pipeline NEVER imports it.
#   * The production release-tag gate (validate-release-tag) runs BEFORE the
#     signing stage, so an invalid tag never reaches the secret-bearing stage.
#   * `main` must stay a protected branch; every .cnb.yml / Gradle / build-script
#     change requires a human diff review (see docs/FIREBASE_TEST_LAB.md §2).

$:
  issue.comment@npc:
    - name: npc-issue-comment
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4-flash
            contextWindow: "1m"
  pull_request.comment@npc:
    - name: npc-pr-comment
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4-flash
            contextWindow: "1m"

  # ------------------------------------------------------------------------
  # DEVELOPMENT: owner-triggered DEBUG APK build.
  #   * Button "Build debug RescueAuth" (web_trigger_debug_apk) is restricted
  #     in .cnb/web_trigger.yml to the owner role on main / feature / fix
  #     branches.
  #   * Builds a standard Android DEBUG APK for real-device smoke testing.
  #   * NEVER imports the production Secret Repo and NEVER touches production
  #     signing passwords / keystores / validation.
  # ------------------------------------------------------------------------
  web_trigger_debug_apk:
    - name: build-debug-rescueauth
      docker:
        image: cimg/android:2026.08
      stages:
        - name: core-jvm-tests
          script: |
            cd v2
            ./gradlew --no-daemon :core:test
        - name: app-robolectric-unit-tests
          script: |
            cd v2
            ./gradlew --no-daemon :app:testDebugUnitTest
        - name: android-lint
          script: |
            cd v2
            ./gradlew --no-daemon :app:lintDebug
        - name: build-debug-apk
          # Builds, verifies (applicationId / versionName / versionCode /
          # debuggable=true / valid debug signature) and produces the
          # descriptive artifact RescueAuth-<versionName>-debug-<sha>.apk.
          # NO imports on purpose: this stage must never see production
          # signing material.
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            bash scripts/build-debug-apk.sh
        - name: upload-debug-apk
          # Uploads exactly the single descriptive debug APK as a commit
          # attachment (CNB_COMMIT default target). The glob matches only the
          # `RescueAuth-*.apk` file the build script produced.
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./v2/app/build/outputs/debug/RescueAuth-*.apk"

  # ------------------------------------------------------------------------
  # RELEASE: PRODUCTION release, TAG-ONLY.
  #   Triggered by `tag_push`. The source is the commit the pushed tag points
  #   to (CNB_COMMIT); CNB_BRANCH is the tag name. Only a tag matching
  #   ^rescueauth-v[0-9]+\.[0-9]+\.[0-9]+$ proceeds; anything else (legacy
  #   `legacy-vX.Y.Z` tags, `main`, feature branches) FAILS CLOSED before any
  #   secret is imported.
  # ------------------------------------------------------------------------
  tag_push:
    - name: production-release-rescueauth
      docker:
        image: cimg/android:2026.08
      lock:
        key: rescueauth-production-release
        wait: true
      stages:
        - name: validate-release-tag
          # Hard FAIL-CLOSED tag gate. Runs BEFORE any secret import, so an
          # invalid tag never reaches the production Secret Repo.
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            version="$(bash scripts/validate-release-tag.sh "${CNB_BRANCH:-}")"
            echo "RELEASE_TAG=${CNB_BRANCH:-}"
            echo "RELEASE_VERSION=${version}"
        - name: core-jvm-tests
          script: |
            cd v2
            ./gradlew --no-daemon :core:test
        - name: app-robolectric-unit-tests
          script: |
            cd v2
            ./gradlew --no-daemon :app:testDebugUnitTest
        - name: android-lint
          script: |
            cd v2
            ./gradlew --no-daemon :app:lintDebug
        - name: production-sign-and-verify
          # Stage-scoped least privilege: no earlier test/build stage can read
          # Android signing material. The referenced Secret Repository file is
          # independent from firebase-test-lab.yml. The script re-validates the
          # tag, derives the version, reconstructs the temporary PKCS12,
          # runs validateReleaseSigning + assembleRelease, and verifies signer,
          # pinned certificate fingerprint, applicationId, versionName
          # (must equal tag-derived version), versionCode and debuggable=false.
          imports:
            - https://cnb.cool/xincy22/rescue_auth_kit_secrets/-/blob/main/android-signing.yml
          script: |
            set -eu
            test "${CNB_REPO_SLUG:-}" = "xincy22/rescue_auth_kit"
            test "${CNB_EVENT:-}" = "tag_push"
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            bash scripts/build-production-apk.sh
        - name: upload-release-apk
          # Independent attachment stage, runs ONLY after the signing and
          # verification stage above has fully succeeded (a stage failure jumps
          # to failStages, so no APK is ever uploaded on signing failure).
          #
          # NO imports on purpose: this stage must NOT see any production
          # signing material. It only consumes the single already-signed,
          # already-verified APK copied into the workspace by the signing
          # script. It attaches the APK to the release tag's commit (CNB_COMMIT
          # is the commit the tag points to), establishing the unambiguous
          # association between the artifact and the rescueauth-vX.Y.Z tag.
          image: cnbcool/attachments:latest
          settings:
            commit: $CNB_COMMIT
            attachments:
              - "./v2/app/build/outputs/production/RescueAuth-*.apk"

main:
  push:
    - name: full-cloud-test-loop
      # Pinned, reproducible Android CI image (JDK 17/21 + Android SDK 34/35/36
      # + build-tools 35.0.0, all version-pinned by the image tag). The same
      # image also carries a pinned gcloud SDK for the Test Lab stage.
      docker:
        image: cimg/android:2026.08
      env:
        # Fixed, non-sensitive Test Lab device configuration.
        # MediumPhone.arm is a VIRTUAL (emulator) FTL model, API 33. Do NOT use
        # `panther` (physical Pixel 7): this pipeline must use one virtual device.
        FTL_DEVICE_MODEL: MediumPhone.arm
        FTL_DEVICE_VERSION: "33"
        FTL_DEVICE_LOCALE: en
        FTL_DEVICE_ORIENTATION: portrait
        FTL_TEST_TIMEOUT: 5m
        # Deterministic Gradle output paths (no unconstrained find|head -1).
        # CNB_BUILD_WORKSPACE is /workspace for script tasks.
        APP_APK: /workspace/v2/app/build/outputs/apk/debug/app-debug.apk
        TEST_APK: /workspace/v2/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      stages:
        - name: core-jvm-tests
          script: |
            cd v2
            ./gradlew --no-daemon :core:test
        - name: app-robolectric-unit-tests
          script: |
            cd v2
            ./gradlew --no-daemon :app:testDebugUnitTest
        - name: android-lint
          script: |
            cd v2
            ./gradlew --no-daemon :app:lintDebug
        - name: build-debug-apk
          script: |
            cd v2
            ./gradlew --no-daemon :app:assembleDebug
            test -s app/build/outputs/apk/debug/app-debug.apk
        - name: build-androidtest-apk
          script: |
            cd v2
            ./gradlew --no-daemon :app:assembleDebugAndroidTest
            test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        - name: changed-file-gate
          # Skips Test Lab for documentation-only pushes. Never skips based on
          # arbitrary strings in commit messages. Always compares the FULL
          # CNB_BEFORE_SHA..CNB_COMMIT range; runs Test Lab when the range is
          # empty/invalid/all-zero. See scripts/check-test-lab-gate.sh.
          # NOTE: inline `script:` runs under /bin/sh (POSIX), so bash-only
          # features (set -o pipefail, [[ ]]) must NOT be used here. The gate
          # script itself is bash and is invoked explicitly via `bash`.
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            export CNB_BEFORE_SHA CNB_COMMIT CNB_BUILD_WORKSPACE
            bash scripts/check-test-lab-gate.sh
        - name: firebase-test-lab
          # Stage-scoped imports: the injected secret variables are visible ONLY
          # to this stage (and its single job). Every other stage of
          # `full-cloud-test-loop` (core/JVM, Robolectric, lint, APK builds,
          # changed-file gate) cannot read them.
          # Secrets are ONLY readable on `main` push (repository restricted to
          # repository=xincy22/rescue_auth_kit, event=push, branch=main).
          imports:
            - https://cnb.cool/xincy22/rescue_auth_kit_secrets/-/blob/main/firebase-test-lab.yml
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            gate=$(grep -E '^TEST_LAB_GATE=' .cnb-gate.env 2>/dev/null | cut -d= -f2- || true)
            if [ "$gate" = "skip" ]; then
              echo "TEST LAB NOT EXECUTED: documentation-only change"
              exit 0
            fi
            echo "FTL_DEVICE_MODEL=${FTL_DEVICE_MODEL}"
            echo "FTL_DEVICE_VERSION=${FTL_DEVICE_VERSION}"
            echo "FTL_DEVICE_LOCALE=${FTL_DEVICE_LOCALE}"
            echo "FTL_DEVICE_ORIENTATION=${FTL_DEVICE_ORIENTATION}"
            echo "FTL_TEST_TIMEOUT=${FTL_TEST_TIMEOUT}"
            echo "FTL_CNB_COMMIT=${CNB_COMMIT}"
            echo "FTL_APP_APK=${APP_APK}"
            echo "FTL_TEST_APK=${TEST_APK}"
            # The runner enforces: single virtual device, no retries, no
            # orchestrator, waits for the matrix to finish, preserves gcloud's
            # raw exit code and classifies it (incl. CONFIGURATION FAILURE and
            # QUOTA EXHAUSTED annotations) in the build log.
            export APP_APK TEST_APK FIREBASE_PROJECT_ID \
                   GCP_SERVICE_ACCOUNT_JSON_BASE64 \
                   FTL_DEVICE_MODEL FTL_DEVICE_VERSION FTL_DEVICE_LOCALE \
                   FTL_DEVICE_ORIENTATION FTL_TEST_TIMEOUT
            export CNB_COMMIT
            bash scripts/run-firebase-test-lab.sh
