# CNB pipeline configuration for rescue_auth_kit
#
# Pipeline layout:
#   $  (fallback branch)
#     issue.comment@npc        -> NPC issue-comment runner (existing, untouched)
#     pull_request.comment@npc -> NPC PR-comment runner (existing, untouched)
#     web_trigger_debug_apk    -> owner-triggered DEBUG APK build (any dev branch)
#     web_trigger_full_test    -> owner-triggered FULL regression test suite (all branches, NO secrets)
#     web_trigger_firebase_test-> owner-triggered Firebase Test Lab on-device tests (main only)
#     tag_push                 -> PRODUCTION release, ONLY from rescueauth-vX.Y.Z tags
#
# ===========================================================================
# TEST TRIGGER POLICY (product decision):
#   * push branch                        -> NO AUTO TEST
#   * PR merge to main                   -> NO AUTO TEST
#   * main update                        -> NO AUTO TEST
#   * Full regression (core+Robolectric+lint+assembleDebug+androidTest) -> MANUAL
#       via "Run full RescueAuth test suite" (web_trigger_full_test)
#   * Firebase device (on-device FTL)    -> MANUAL
#       via "Run Firebase device tests"  (web_trigger_firebase_test)
#   * Production rescueauth-vX.Y.Z       -> automatic release gates unchanged (tag_push)
#
#   There is NO pipeline triggered by `main: push` / `pull_request.merged` that
#   runs any Firebase Test Lab, Android test or Gradle test stage. The former
#   `main: push -> full-cloud-test-loop` automatic pipeline is REMOVED and is
#   NOT re-added. Firebase Test Lab now runs ONLY from the manual, owner-only
#   "Run Firebase device tests" button.
#
# ---------------------------------------------------------------------------
# Build & Release Workflow (see README "Branch / Version / Release Policy"):
#
#   DEVELOPMENT (all manual, owner-only):
#     feature/fix branch or main
#       -> owner triggers "Build debug RescueAuth" (web_trigger_debug_apk)
#       -> tests / assembleDebug / debug signing
#       -> RescueAuth-<versionName>-debug-<shortCommit>.apk
#       -> real-device smoke -> PR -> main
#     Full regression on demand (manual, owner-only, all branches)
#       -> owner triggers "Run full RescueAuth test suite" (web_trigger_full_test)
#       -> core tests / Robolectric / lint / assembleDebug /
#          assembleDebugAndroidTest  (full original coverage, no shrink, NO secrets)
#     On-device cloud verification on demand (manual, owner-only, main only)
#       -> owner triggers "Run Firebase device tests" (web_trigger_firebase_test)
#       -> assemble/validate debug APK + androidTest APK
#       -> Firebase Test Lab single virtual device matrix (FTL credentials
#          imported ONLY here, via the firebase-test-lab.yml secret repo)
#
#   RELEASE (TAG-ONLY):
#     main reaches release-ready
#       -> owner creates annotated tag:  rescueauth-vX.Y.Z
#       -> tag_push pipeline (below)
#       -> assert tag format ^rescueauth-v[0-9]+\.[0-9]+\.[0-9]+$
#       -> assert tag version == Android versionName
#       -> production Secret Repo import (signing stage only)
#       -> temporary PKCS12 -> production signing
#       -> apksigner verify + pinned cert fingerprint + APK identity
#       -> RescueAuth-X.Y.Z.apk attached to the tag's commit
#
#   main / feature / fix branches are NEVER production-released.
#   Legacy tags (namespace legacy-vX.Y.Z) are preserved and never enter the
#   new production release path.
#
# ---------------------------------------------------------------------------
# Security boundary:
#   * There is NO automatic full-test / Firebase Test Lab pipeline on push/merge
#     to main. Tests and Firebase Test Lab are MANUAL and owner-only.
#   * The Firebase Test Lab Secret Repo
#     (xincy22/rescue_auth_kit_secrets -> firebase-test-lab.yml) is imported ONLY
#     by the `firebase-test-lab` stage of the `web_trigger_firebase_test`
#     pipeline. No other stage/pipeline imports it.
#   * The production Android signing Secret Repo
#     (xincy22/rescue_auth_kit_secrets -> android-signing.yml) is imported ONLY
#     by the `production-sign-and-verify` stage of the `tag_push` pipeline. No
#     other stage/pipeline imports it. Neither the debug pipeline nor the two
#     manual test pipelines ever import android-signing.yml.
#   * The production release-tag gate (validate-release-tag) runs BEFORE the
#     signing stage, so an invalid tag never reaches the secret-bearing stage.
#   * `main` must stay a protected branch; every .cnb.yml / Gradle / build-script
#     change requires a human diff review (see docs/FIREBASE_TEST_LAB.md §2).

$:
  issue.comment@npc:
    - name: npc-issue-comment
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4-flash
            contextWindow: "1m"
  pull_request.comment@npc:
    - name: npc-pr-comment
      docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4-flash
            contextWindow: "1m"

  # ------------------------------------------------------------------------
  # DEVELOPMENT: owner-triggered DEBUG APK build.
  #   * Button "Build debug RescueAuth" (web_trigger_debug_apk) is restricted
  #     in .cnb/web_trigger.yml to the owner role on main / feature / fix
  #     branches.
  #   * Builds a standard Android DEBUG APK for real-device smoke testing.
  #   * NEVER imports the production Secret Repo and NEVER touches production
  #     signing passwords / keystores / validation.
  # ------------------------------------------------------------------------
  web_trigger_debug_apk:
    - name: build-debug-rescueauth
      docker:
        image: cimg/android:2026.08
      stages:
        - name: core-jvm-tests
          script: |
            cd v2
            ./gradlew --no-daemon :core:test
        - name: app-robolectric-unit-tests
          script: |
            cd v2
            ./gradlew --no-daemon :app:testDebugUnitTest
        - name: android-lint
          script: |
            cd v2
            ./gradlew --no-daemon :app:lintDebug
        - name: build-debug-apk
          # Builds, verifies (applicationId / versionName / versionCode /
          # debuggable=true / valid debug signature) and produces the
          # descriptive artifact RescueAuth-<versionName>-debug-<sha>.apk.
          # NO imports on purpose: this stage must never see production
          # signing material.
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            bash scripts/build-debug-apk.sh
        - name: upload-debug-apk
          # Uploads exactly the single descriptive debug APK as a commit
          # attachment (CNB_COMMIT default target). The glob matches only the
          # `RescueAuth-*.apk` file the build script produced.
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./v2/app/build/outputs/debug/RescueAuth-*.apk"

  # ------------------------------------------------------------------------
  # REGRESSION: owner-triggered FULL test suite.
  #   * Button "Run full RescueAuth test suite" (web_trigger_full_test) is
  #     restricted in .cnb/web_trigger.yml to the owner role and is available
  #     on ALL branches (all-branches matcher `.*`).
  #   * Runs the FULL regression body: core JVM tests, app Robolectric, lint,
  #     assembleDebug, assembleDebugAndroidTest, plus a non-secret artifact
  #     validation step. Nothing is skipped or weakened; a test failure FAILS
  #     the pipeline.
  #   * NO imports on purpose: this pipeline NEVER touches the Firebase Test
  #     Lab secret repo, the production Android signing Secret Repo, or any
  #     production password. Firebase Test Lab is deliberately NOT part of this
  #     pipeline; on-device FTL runs separately via the manual
  #     "Run Firebase device tests" button (web_trigger_firebase_test).
  #   * Ordinary push / PR merge / main update does NOT run this pipeline;
  #     it is triggered manually by the owner only.
  # ------------------------------------------------------------------------
  web_trigger_full_test:
    - name: run-full-test-suite
      docker:
        image: cimg/android:2026.08
      # No imports: this pipeline must never see Firebase Test Lab credentials
      # or any production signing material.
      stages:
        - name: core-jvm-tests
          script: |
            cd v2
            ./gradlew --no-daemon :core:test
        - name: app-robolectric-unit-tests
          script: |
            cd v2
            ./gradlew --no-daemon :app:testDebugUnitTest
        - name: android-lint
          script: |
            cd v2
            ./gradlew --no-daemon :app:lintDebug
        - name: build-debug-apk
          script: |
            cd v2
            ./gradlew --no-daemon :app:assembleDebug
            test -s app/build/outputs/apk/debug/app-debug.apk
        - name: build-androidtest-apk
          script: |
            cd v2
            ./gradlew --no-daemon :app:assembleDebugAndroidTest
            test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        - name: validate-artifacts
          # Meaningful, secret-free verification that both Gradle artifacts the
          # full suite is supposed to produce actually exist and are non-empty.
          # (The on-device Firebase Test Lab matrix that would consume these
          # APKs is NOT run here; it is a separate manual pipeline.)
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            app_apk="v2/app/build/outputs/apk/debug/app-debug.apk"
            test_apk="v2/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            test -s "${app_apk}"
            test -s "${test_apk}"
            echo "DEBUG_APK_PRESENT=${app_apk}"
            echo "ANDROIDTEST_APK_PRESENT=${test_apk}"
            echo "Full regression suite PASSED. Firebase Test Lab is intentionally"
            echo "NOT run from this pipeline; use the manual 'Run Firebase device tests'"
            echo "button (web_trigger_firebase_test) for on-device cloud verification."

  # ------------------------------------------------------------------------
  # FIREBASE DEVICE TESTS: owner-triggered Firebase Test Lab on-device testing.
  #   * Button "Run Firebase device tests" (web_trigger_firebase_test) is
  #     restricted in .cnb/web_trigger.yml to the owner role on `main` ONLY.
  #   * Builds and validates the debug APK and the androidTest APK, then submits
  #     a SINGLE Firebase Test Lab virtual-device instrumentation matrix.
  #   * This is the ONLY pipeline that may import the Firebase Test Lab
  #     credentials (xincy22/rescue_auth_kit_secrets -> firebase-test-lab.yml).
  #     Those credentials are imported STAGE-scoped so only the firebase-test-lab
  #     stage sees them.
  #   * The FTL secret repo must declare `allow_events` to include this
  #     web_trigger event (web_trigger is a TRUSTED event; see the Final Report)
  #     and `allow_branches: main`. See docs/FIREBASE_TEST_LAB.md.
  #   * It NEVER touches the production Android signing Secret Repo.
  #   * Ordinary push / PR merge / main update does NOT run this pipeline; it is
  #     triggered manually by the owner only.
  # ------------------------------------------------------------------------
  web_trigger_firebase_test:
    - name: run-firebase-device-tests
      docker:
        image: cimg/android:2026.08
      env:
        # Fixed, non-sensitive Test Lab device configuration.
        # MediumPhone.arm is a VIRTUAL (emulator) FTL model, API 33. Do NOT use
        # `panther` (physical Pixel 7): this pipeline must use one virtual device.
        FTL_DEVICE_MODEL: MediumPhone.arm
        FTL_DEVICE_VERSION: "33"
        FTL_DEVICE_LOCALE: en
        FTL_DEVICE_ORIENTATION: portrait
        FTL_TEST_TIMEOUT: 5m
        # Deterministic Gradle output paths (no unconstrained find|head -1).
        # CNB_BUILD_WORKSPACE is /workspace for script tasks.
        APP_APK: /workspace/v2/app/build/outputs/apk/debug/app-debug.apk
        TEST_APK: /workspace/v2/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      stages:
        - name: build-debug-apk
          script: |
            cd v2
            ./gradlew --no-daemon :app:assembleDebug
            test -s app/build/outputs/apk/debug/app-debug.apk
        - name: build-androidtest-apk
          script: |
            cd v2
            ./gradlew --no-daemon :app:assembleDebugAndroidTest
            test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        - name: validate-apks
          # Secret-free pre-flight: confirm both APKs exist before touching the
          # credential-bearing stage. This stage must never see FTL credentials,
          # so it runs BEFORE the credential import below.
          script: |
            set -eu
            test -s "${APP_APK}"
            test -s "${TEST_APK}"
            echo "DEBUG_APK_PRESENT=${APP_APK}"
            echo "ANDROIDTEST_APK_PRESENT=${TEST_APK}"
        - name: firebase-test-lab
          # STAGE-scoped import (least privilege): only this stage can read the
          # Firebase Test Lab credentials. The preceding build/validate stages
          # and the whole rest of the pipeline cannot see them.
          imports:
            - https://cnb.cool/xincy22/rescue_auth_kit_secrets/-/blob/main/firebase-test-lab.yml
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            bash scripts/run-firebase-test-lab.sh

  # ------------------------------------------------------------------------
  # RELEASE: PRODUCTION release, TAG-ONLY.
  #   Triggered by `tag_push`. The source is the commit the pushed tag points
  #   to (CNB_COMMIT); CNB_BRANCH is the tag name. Only a tag matching
  #   ^rescueauth-v[0-9]+\.[0-9]+\.[0-9]+$ proceeds; anything else (legacy
  #   `legacy-vX.Y.Z` tags, `main`, feature branches) FAILS CLOSED before any
  #   secret is imported.
  # ------------------------------------------------------------------------
  tag_push:
    - name: production-release-rescueauth
      docker:
        image: cimg/android:2026.08
      lock:
        key: rescueauth-production-release
        wait: true
      stages:
        - name: validate-release-tag
          # Hard FAIL-CLOSED tag gate. Runs BEFORE any secret import, so an
          # invalid tag never reaches the production Secret Repo.
          script: |
            set -eu
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            version="$(bash scripts/validate-release-tag.sh "${CNB_BRANCH:-}")"
            echo "RELEASE_TAG=${CNB_BRANCH:-}"
            echo "RELEASE_VERSION=${version}"
        - name: core-jvm-tests
          script: |
            cd v2
            ./gradlew --no-daemon :core:test
        - name: app-robolectric-unit-tests
          script: |
            cd v2
            ./gradlew --no-daemon :app:testDebugUnitTest
        - name: android-lint
          script: |
            cd v2
            ./gradlew --no-daemon :app:lintDebug
        - name: production-sign-and-verify
          # Stage-scoped least privilege: no earlier test/build stage can read
          # Android signing material. The referenced Secret Repository file is
          # independent from firebase-test-lab.yml. The script re-validates the
          # tag, derives the version, reconstructs the temporary PKCS12,
          # runs validateReleaseSigning + assembleRelease, and verifies signer,
          # pinned certificate fingerprint, applicationId, versionName
          # (must equal tag-derived version), versionCode and debuggable=false.
          imports:
            - https://cnb.cool/xincy22/rescue_auth_kit_secrets/-/blob/main/android-signing.yml
          script: |
            set -eu
            test "${CNB_REPO_SLUG:-}" = "xincy22/rescue_auth_kit"
            test "${CNB_EVENT:-}" = "tag_push"
            cd "${CNB_BUILD_WORKSPACE:-/workspace}"
            bash scripts/build-production-apk.sh
        - name: upload-release-apk
          # Independent attachment stage, runs ONLY after the signing and
          # verification stage above has fully succeeded (a stage failure jumps
          # to failStages, so no APK is ever uploaded on signing failure).
          #
          # NO imports on purpose: this stage must NOT see any production
          # signing material. It only consumes the single already-signed,
          # already-verified APK copied into the workspace by the signing
          # script. It attaches the APK to the release tag's commit (CNB_COMMIT
          # is the commit the tag points to), establishing the unambiguous
          # association between the artifact and the rescueauth-vX.Y.Z tag.
          image: cnbcool/attachments:latest
          settings:
            commit: $CNB_COMMIT
            attachments:
              - "./v2/app/build/outputs/production/RescueAuth-*.apk"

