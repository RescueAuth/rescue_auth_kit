<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Authenticator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8da2f5"/>
      <stop offset="45%" stop-color="#6f83ec"/>
      <stop offset="100%" stop-color="#4c56c9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c6d4ff"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <circle cx="256" cy="256" r="232" fill="url(#bg)"/>

  <!-- Token ring with a gap (bottom-right), rotating-code meaning -->
  <g transform="rotate(45 256 256)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="44"
            stroke-linecap="round" stroke-dasharray="802 140"/>
  </g>

  <!-- Rounded clock hands:
       minute hand = long white round-cap stroke (~10 o'clock, -120°)
       hour hand   = short soft-white round-cap stroke (~2 o'clock, 60°) -->
  <g stroke-linecap="round">
    <!-- Minute hand -->
    <line x1="256" y1="256" x2="256" y2="184" stroke="#ffffff" stroke-width="18"
          transform="rotate(-120 256 256)"/>
    <!-- Hour hand -->
    <line x1="256" y1="258" x2="256" y2="216" stroke="#eef2ff" stroke-width="24"
          transform="rotate(60 256 256)"/>
  </g>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
</svg>
