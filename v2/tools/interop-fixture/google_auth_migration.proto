// Confirmed Google Authenticator `otpauth-migration` protobuf schema.
//
// Cross-verified from three independent implementations:
//   1. Aegis:      app/src/main/proto/google_auth.proto
//                  (https://github.com/beemdevelopment/Aegis)
//   2. ente auth:  mobile/apps/auth/protos/googleauth.proto
//                  (https://github.com/ente-io/ente)
//   3. Go otpauth: vendor/github.com/creachadair/otp/otpauth/migration.go
//                  (https://github.com/pcarrier/gauth)
// and validated against real Google Authenticator v6.0 export URIs
// (krissrex/google-authenticator-exporter test-assets, synthetic accounts).
//
// IMPORTANT enum semantics (verified, NOT raw ints):
//   Algorithm  : 0 = ALGORITHM_UNSPECIFIED, 1 = SHA1, 2 = SHA256,
//                3 = SHA512, 4 = MD5
//   DigitCount : 0 = DIGIT_COUNT_UNSPECIFIED, 1 = SIX(6), 2 = EIGHT(8)
//   OtpType    : 0 = OTP_TYPE_UNSPECIFIED, 1 = HOTP, 2 = TOTP
//
// Google Authenticator emits the whole message as STANDARD Base64 (RFC 4648
// §4, with `+` `/` and `=` padding) percent-encoded into the `data` query
// parameter. Batch metadata (batch_size / batch_index / batch_id) is carried
// inside this message.

syntax = "proto3";

package googleauth;

message MigrationPayload {
  enum Algorithm {
    ALGORITHM_UNSPECIFIED = 0;
    ALGORITHM_SHA1 = 1;
    ALGORITHM_SHA256 = 2;
    ALGORITHM_SHA512 = 3;
    ALGORITHM_MD5 = 4;
  }

  enum DigitCount {
    DIGIT_COUNT_UNSPECIFIED = 0;
    DIGIT_COUNT_SIX = 1;
    DIGIT_COUNT_EIGHT = 2;
  }

  enum OtpType {
    OTP_TYPE_UNSPECIFIED = 0;
    OTP_TYPE_HOTP = 1;
    OTP_TYPE_TOTP = 2;
  }

  message OtpParameters {
    bytes secret = 1;
    string name = 2;
    string issuer = 3;
    Algorithm algorithm = 4;
    DigitCount digits = 5;
    OtpType type = 6;
    int64 counter = 7;
    string unique_id = 8;
  }

  repeated OtpParameters otp_parameters = 1;
  int32 version = 2;
  int32 batch_size = 3;
  int32 batch_index = 4;
  int32 batch_id = 5;
}
