name: Android manual builds
on:
  workflow_dispatch:
    inputs:
      task:
        description: Build a smoke APK or run the full regression suite
        type: choice
        options: [debug, full]
        default: full
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'RescueAuth/rescue_auth_kit' && github.actor == 'xincy22' && github.triggering_actor == 'xincy22'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Full regression
        if: inputs.task == 'full'
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build and verify debug APK
        run: bash scripts/build-debug-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-${{ github.sha }}
          path: app/build/outputs/debug/RescueAuth-*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test reports
        if: always() && inputs.task == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            core/build/test-results/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 14
